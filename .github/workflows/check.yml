name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.2'
          python-version: '3.12'
      - run: uv sync --frozen
      - run: uv run python scripts/prepare_vad.py
      - run: uv run ruff check cassini_live scripts tests
      - run: uv run python scripts/check_manifest.py
      - run: uv run pytest -m 'not integration'
      - run: uv run python scripts/prepare_model.py
      - run: uv run pytest -m integration
  release-tooling:
    # The App Store package and the release scripts: shellcheck, the scripts'
    # own tests, and an unsigned store archive built and validated the way the
    # store reads it (pre-info.xslt, then info.xsd).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends shellcheck xsltproc libxml2-utils
      - run: shellcheck -x --source-path=SCRIPTDIR --severity=style scripts/*.sh
      - run: ./scripts/test-release-tooling.sh
      - run: |
          version="$(sed -n 's|.*<version>\(.*\)</version>.*|\1|p' appstore/info.xml | head -n1)"
          ./scripts/build-appstore-tarball.sh --version "$version"
          ./scripts/validate-appstore-tarball.sh --version "$version" \
            --tarball build/artifacts/appstore/cassini_live.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: cassini-live-appstore-unsigned
          path: build/artifacts/appstore/*.tar.gz
  ui:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run check:build
      # dist/ is gitignored; the e2e suite and the fixture server read it,
      # so build it (check:build above already proved it matches the source).
      - run: npm run build
      - run: npm run test:unit
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
  container:
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: cassini-live:test
      - run: >-
          docker run --rm --network none --entrypoint python cassini-live:test
          -c 'import needle; needle.Whistle(weights="/opt/whistle/whistle.cact"); print("Whistle ready offline")'
      - name: Refuse to load an engine without finite cgroup limits
        run: >-
          docker run --rm --network none --entrypoint python cassini-live:test
          -c 'import asyncio; from cassini_live.pool import WorkerPool; from cassini_live.capacity import CapacityAssessment; from cassini_live.safety import SafetyController; p=WorkerPool(2); s=SafetyController(p,CapacityAssessment(p)); asyncio.run(s.start()); assert s.state == "blocked" and not p.workers; print(s.status())'
