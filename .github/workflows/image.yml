# Container image — build and push ghcr.io/codemyriad/cassini-live.
#
# A release tag v<version> pushes the immutable :<version> image that both
# manifests pin as <image-tag>; the App Store release (release.yml) refuses to
# publish until that image exists for amd64 and arm64. Never move or delete a
# :<version> tag a store release pins: AppAPI pulls exactly that tag on install
# and update.
#
# A manual run builds any branch and pushes only :sha-<commit>, so it can never
# overwrite a released version.
#
# As in Cassini (gocassini's publish-exapp-image.yml), each platform builds on a
# native runner rather than under QEMU, and is smoke-tested there before it is
# pushed by digest; `publish` then joins the two digests into one tagged
# multi-arch image. A broken platform therefore publishes nothing.
name: Publish image
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false
env:
  REGISTRY: ghcr.io
jobs:
  prepare:
    name: Version and tags
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.tags.outputs.image }}
      tags: ${{ steps.tags.outputs.tags }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.2'
          python-version: '3.12'
      - run: uv sync --frozen
      - run: uv run python scripts/check_manifest.py
      - id: version
        run: echo "value=$(uv run python -c 'import cassini_live; print(cassini_live.__version__)')" >> "$GITHUB_OUTPUT"
      - name: Tag matches the version, on the branch it is cut on
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the manifest version $VERSION"; exit 1
          fi
          ./scripts/check-tag-branch.sh "$VERSION" "$GITHUB_SHA"
      - id: tags
        env:
          EVENT: ${{ github.event_name }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          image="${REGISTRY}/${GITHUB_REPOSITORY_OWNER}/cassini-live"
          tags="${image}:sha-${GITHUB_SHA::12}"
          if [[ "$EVENT" == push ]]; then tags="${image}:${VERSION},${tags}"; fi
          {
            echo "image=$image"
            echo "tags=$tags"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build and smoke-test (${{ matrix.platform }})
    needs: prepare
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build for the smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: cassini-live:smoke
          cache-from: type=gha,scope=image-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.arch }}
      # The same checks as check.yml's container job, on the image about to ship.
      - name: Whistle loads offline
        run: >-
          docker run --rm --network none --entrypoint python cassini-live:smoke
          -c 'import needle; needle.Whistle(weights="/opt/whistle/whistle.cact"); print("Whistle ready offline")'
      - name: Refuse to load an engine without finite cgroup limits
        run: >-
          docker run --rm --network none --entrypoint python cassini-live:smoke
          -c 'import asyncio; from cassini_live.pool import WorkerPool; from cassini_live.capacity import CapacityAssessment; from cassini_live.safety import SafetyController; p=WorkerPool(2); s=SafetyController(p,CapacityAssessment(p)); asyncio.run(s.start()); assert s.state == "blocked" and not p.workers; print(s.status())'
      # Same inputs as the smoke build, so every layer comes from its cache:
      # what is pushed is what was tested.
      - name: Push by digest
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=image,name=${{ needs.prepare.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=image-${{ matrix.arch }}
      - name: Record the digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Tag the multi-arch image
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create the manifest list
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          TAGS: ${{ needs.prepare.outputs.tags }}
        run: |
          set -euo pipefail
          args=()
          IFS=',' read -ra tag_list <<< "$TAGS"
          for tag in "${tag_list[@]}"; do args+=(-t "$tag"); done
          sources=()
          for digest in *; do sources+=("${IMAGE}@sha256:${digest}"); done
          if [[ "${#sources[@]}" -ne 2 ]]; then
            echo "::error::expected 2 platform digests, got ${#sources[@]}"; exit 1
          fi
          docker buildx imagetools create "${args[@]}" "${sources[@]}"
          docker buildx imagetools inspect "${tag_list[0]}"
