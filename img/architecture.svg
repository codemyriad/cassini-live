<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="436" viewBox="0 0 1120 436" role="img" aria-labelledby="arch-title arch-desc">
  <!-- Hand-edited SVG; this file is the diagram's source. The palette
       (#6e7a87 ink, #0f9d8d media path) reads on light and dark grounds,
       and the background is transparent on purpose. -->
  <title id="arch-title">Cassini Live architecture</title>
  <desc id="arch-desc">Three zones. Browser: the transcript sidebar. Nextcloud server: AppAPI and the Talk HPB. Cassini Live container: temporary Talk proxy, caption provider API, room manager, call history, Whistle or Nemotron, and Silero VAD. Start requests go from the sidebar through AppAPI and the proxy to the API, which joins the call. The HPB sends WebRTC audio per speaker to the room manager; Silero VAD gates speech segments into the engine; caption text returns to the HPB, which delivers live captions to the sidebar. The API reads call history for catch-up.</desc>
  <defs>
    <marker id="ahn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6e7a87"/>
    </marker>
    <marker id="aht" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0f9d8d"/>
    </marker>
  </defs>

  <!-- Zones: each dashed border is a real network boundary -->
  <g fill="none" stroke="#6e7a87" stroke-width="1" stroke-dasharray="3 5" opacity="0.65">
    <rect x="16" y="56" width="200" height="364" rx="10"/>
    <rect x="240" y="56" width="260" height="364" rx="10"/>
    <rect x="524" y="56" width="580" height="364" rx="10"/>
  </g>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" fill="#6e7a87" font-size="10.5" font-weight="600" letter-spacing="0.08em">
    <text x="32" y="78">BROWSER</text>
    <text x="256" y="78">NEXTCLOUD SERVER</text>
    <text x="540" y="78">CASSINI LIVE · EXAPP CONTAINER</text>
  </g>

  <!-- Nodes (dashed box: the temporary proxy; teal boxes: the media path) -->
  <g fill="rgba(110,122,135,0.10)" stroke="#6e7a87" stroke-width="1.3">
    <rect x="32" y="216" width="168" height="62" rx="6"/>
    <rect x="264" y="96" width="212" height="62" rx="6"/>
    <rect x="548" y="96" width="192" height="62" rx="6" stroke-dasharray="6 4"/>
    <rect x="784" y="96" width="296" height="62" rx="6"/>
    <rect x="548" y="226" width="240" height="62" rx="6"/>
    <rect x="832" y="226" width="248" height="62" rx="6"/>
  </g>
  <g fill="rgba(15,157,141,0.10)" stroke="#0f9d8d" stroke-width="1.4">
    <rect x="264" y="340" width="212" height="62" rx="6"/>
    <rect x="548" y="340" width="212" height="62" rx="6"/>
    <rect x="818" y="340" width="262" height="62" rx="6"/>
  </g>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" fill="#6e7a87" text-anchor="middle">
    <g font-size="13" font-weight="600">
      <text x="116" y="242">Transcript sidebar</text>
      <text x="370" y="122">AppAPI</text>
      <text x="644" y="122">Temporary Talk proxy</text>
      <text x="932" y="122">Caption provider API</text>
      <text x="668" y="252">Room manager</text>
      <text x="956" y="252">Call history</text>
      <text x="370" y="366">Talk HPB</text>
      <text x="654" y="366">Whistle / Nemotron</text>
      <text x="949" y="366">Silero VAD</text>
    </g>
    <g font-size="11">
      <text x="116" y="261">opened by bookmarklet</text>
      <text x="370" y="141">adds auth headers</text>
      <text x="644" y="141">makes Talk's checks</text>
      <text x="932" y="141">same contract as upstream</text>
      <text x="668" y="271">HPB signalling client</text>
      <text x="956" y="271">bounded, in memory</text>
      <text x="370" y="385">high-performance backend</text>
      <text x="654" y="385">speech to text</text>
      <text x="949" y="385">speech gate</text>
    </g>
    <!-- Arrow labels -->
    <g font-size="10.5">
      <text x="512" y="119">declared</text>
      <text x="762" y="119">HTTP</text>
      <text x="770" y="178">joins the call</text>
      <text x="460" y="250">WebRTC audio · per speaker</text>
      <text x="830" y="307">16 kHz mono audio</text>
      <text x="789" y="354">speech</text>
      <text x="789" y="365">segments</text>
      <text x="512" y="363">caption text</text>
      <text x="190" y="363">live captions</text>
    </g>
    <text font-size="10.5" text-anchor="end" x="944" y="196">catch-up lines</text>
    <text font-size="10.5" transform="translate(222 186) rotate(-90)">start · catch-up</text>
  </g>

  <!-- Control path -->
  <g fill="none" stroke="#6e7a87" stroke-width="1.3">
    <polyline points="200,236 232,236 232,136 260,136" marker-end="url(#ahn)"/>
    <line x1="476" y1="127" x2="544" y2="127" marker-end="url(#ahn)"/>
    <line x1="740" y1="127" x2="780" y2="127" marker-end="url(#ahn)"/>
    <polyline points="870,158 870,185 668,185 668,222" marker-end="url(#ahn)"/>
    <line x1="956" y1="226" x2="956" y2="162" stroke-dasharray="4 4" marker-end="url(#ahn)"/>
  </g>
  <!-- Media path: audio in, captions out, through the one HPB -->
  <g fill="none" stroke="#0f9d8d" stroke-width="1.4">
    <polyline points="370,340 370,257 544,257" marker-end="url(#aht)"/>
    <polyline points="700,288 700,314 949,314 949,336" marker-end="url(#aht)"/>
    <line x1="818" y1="376" x2="764" y2="376" marker-end="url(#aht)"/>
    <line x1="548" y1="371" x2="480" y2="371" marker-end="url(#aht)"/>
    <polyline points="264,371 116,371 116,282" marker-end="url(#aht)"/>
  </g>
</svg>
